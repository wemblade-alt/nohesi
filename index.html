
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NO HESI 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080b12;color:white;font-family:Arial}
canvas{display:block}
#hud{position:fixed;top:20px;left:20px;pointer-events:none}
#speed{position:fixed;bottom:25px;left:25px;font-size:55px;font-weight:bold}
#speed small{font-size:15px}
#menu{position:fixed;inset:0;background:#080b12;display:grid;place-items:center;text-align:center;z-index:5}
h1{font-size:75px;margin:0;letter-spacing:-5px}
h1 span{color:#f22}
button{background:#f22;color:white;border:0;padding:16px 30px;font-weight:bold;cursor:pointer;margin:8px}
#help{position:fixed;bottom:25px;right:25px;text-align:right;font-size:12px}
</style>
</head>
<body>
<div id="menu">
 <div>
  <h1>NO <span>HESI</span></h1>
  <p>3D HIGHWAY SIMULATOR</p>
  <p>Drive fast. Dodge traffic. Don't crash.</p>
  <button id="start">START DRIVING</button>
  <p>WASD / ARROWS TO DRIVE • SHIFT = NITRO • C = CAMERA</p>
 </div>
</div>
<div id="hud">NO HESI 3D<br>HIGHWAY RUN</div>
<div id="speed">000 <small>MPH</small></div>
<div id="help">WASD - DRIVE<br>SPACE - DRIFT<br>SHIFT - NITRO<br>C - CAMERA</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91a5bb);
scene.fog=new THREE.Fog(0x91a5bb,90,300);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,700);
camera.position.set(0,6,13);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcce4ff,0x303030,2));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-20,40,20);
sun.castShadow=true;
scene.add(sun);

function material(color,roughness=.6,metalness=.1){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
function cube(parent,w,h,d,x,y,z,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

// Highway
cube(scene,24,.2,650,0,-.3,-280,material(0x24282c));
cube(scene,500,.1,650,0,-.5,-280,material(0x374a36));
for(let x of [-8,-4,0,4,8]){
 for(let z=-600;z<30;z+=14){
  cube(scene,.1,.025,5,x,-.18,z,material(0xffffff));
 }
}
for(let x of [-12,12]){
 cube(scene,.3,.4,650,x,-.1,-280,material(0x777777));
}

// City buildings
const buildings=[];
for(let i=0;i<70;i++){
 let side=i%2?1:-1;
 let h=10+Math.random()*40;
 let b=new THREE.Group();
 cube(b,10,h,12,0,h/2,0,material(0x3d4753));
 b.position.set(side*(20+Math.random()*30),0,-Math.random()*550);
 scene.add(b);
 buildings.push(b);
}

// Car
function createCar(color){
 const car=new THREE.Group();
 const paint=material(color,.2,.8);
 const glass=new THREE.MeshPhysicalMaterial({color:0x172d40,metalness:.5,roughness:.15});
 cube(car,2.1,.6,4.5,0,.8,0,paint);
 cube(car,1.7,.8,2.1,0,1.45,-.3,glass);
 cube(car,1.9,.15,.12,0,.9,-2.3,material(0xffffff));
 cube(car,1.9,.15,.12,0,.9,2.3,material(0xff001c));
 const wheels=[];
 for(let x of [-1.1,1.1]){
  for(let z of [-1.5,1.5]){
   let w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.25,24),material(0x101010));
   w.rotation.z=Math.PI/2;
   w.position.set(x,.45,z);
   car.add(w);
   wheels.push(w);
  }
 }
 car.userData.wheels=wheels;
 return car;
}
let player=createCar(0xe51c35);
scene.add(player);

// Traffic
const traffic=[];
const colors=[0xffffff,0x171717,0x176aaf,0x888888,0xd7a72c];
function spawn(z){
 const car=createCar(colors[Math.floor(Math.random()*colors.length)]);
 const lane=[-10,-6,-2,2,6,10][Math.floor(Math.random()*6)];
 car.position.set(lane,0,z);
 car.rotation.y=Math.PI;
 scene.add(car);
 traffic.push({car,speed:40+Math.random()*35});
}
for(let i=0;i<20;i++)spawn(-35-i*25);

let speed=0,steer=0,nitro=100,distance=0;
let started=false,cam=0,drift=false;
const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="c")cam=(cam+1)%3;
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

document.getElementById("start").onclick=()=>{
 document.getElementById("menu").style.display="none";
 started=true;
};

function update(dt){
 if(!started)return;
 dt=Math.min(dt,.04);

 if(keys.w||keys.arrowup)speed+=45*dt;
 else speed-=12*dt;
 if(keys.s||keys.arrowdown)speed-=85*dt;
 drift=keys[" "];
 if(keys.shift&&nitro>0){
  speed+=90*dt;
  nitro-=25*dt;
 }else nitro=Math.min(100,nitro+7*dt);
 speed=THREE.MathUtils.clamp(speed,0,240);

 let direction=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);
 steer=THREE.MathUtils.damp(steer,direction,5,dt);
 player.position.x+=steer*speed*.025*(drift?1.5:1)*dt;
 player.position.x=THREE.MathUtils.clamp(player.position.x,-11,11);
 player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-steer*.2,5,dt);

 for(const w of player.userData.wheels)w.rotation.x+=speed*dt*.1;

 for(let i=traffic.length-1;i>=0;i--){
  let t=traffic[i];
  t.car.position.z+=(speed-t.speed)*.23*dt;
  for(const w of t.car.userData.wheels)w.rotation.x+=t.speed*dt*.1;
  if(Math.abs(t.car.position.z)<3.5&&Math.abs(t.car.position.x-player.position.x)<2.1){
   speed*=.8;
  }
  if(t.car.position.z>15){
   scene.remove(t.car);
   traffic.splice(i,1);
   spawn(-500-Math.random()*100);
  }
 }

 for(const b of buildings){
  b.position.z+=speed*.23*dt;
  if(b.position.z>30)b.position.z=-550-Math.random()*100;
 }

 distance+=speed*dt/1609;
 document.getElementById("speed").innerHTML=Math.round(speed)+" <small>MPH</small>";

 const target=cam===0?
 new THREE.Vector3(player.position.x*.5,5,13):
 cam===1?
 new THREE.Vector3(player.position.x,2.4,4):
 new THREE.Vector3(player.position.x,10,19);
 camera.position.lerp(target,1-Math.exp(-4*dt));
 camera.lookAt(player.position.x*.5,1,-15);
}

let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 let dt=(now-last)/1000;
 last=now;
 update(dt);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
